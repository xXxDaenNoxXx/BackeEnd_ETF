pagos:
  topic-transacciones: transacciones.completadas
  topic-alertas: alertas.seguridad
  # Pagos/transferencias sobre este monto generan una alerta de seguridad (evento Kafka)
  umbral-alerta-monto: 1000000

# ---- Resilience4j: llamadas de ms-pagos hacia ms-cuentas (debitar / acreditar) ----
resilience4j:
  circuitbreaker:
    instances:
      msCuentas:
        sliding-window-size: 6
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      msCuentas:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
