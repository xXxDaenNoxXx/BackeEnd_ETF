spring.application.name=bffmovil
server.port=8092

# En docker-compose se sobreescribe con http://ms-core-banco:8090
core.base-url=${CORE_BASE_URL:http://localhost:8090}

# ===== HTTPS =====
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=bffmovil

# Compresion de respuestas (menos bytes por la red)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=512

# ===== Resilience4j: Circuit Breaker + Retry hacia ms-core-banco =====
resilience4j.circuitbreaker.instances.msCoreBanco.sliding-window-size=5
resilience4j.circuitbreaker.instances.msCoreBanco.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.msCoreBanco.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msCoreBanco.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.msCoreBanco.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.msCoreBanco.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.retry.instances.msCoreBanco.max-attempts=3
resilience4j.retry.instances.msCoreBanco.wait-duration=300ms
resilience4j.retry.instances.msCoreBanco.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

management.endpoints.web.exposure.include=health,info

# ===== OAuth2.0 =====
auth.jwks-uri=${AUTH_JWKS_URI:http://localhost:9000/oauth2/jwks}
auth.token-uri=${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}

# 1) Resource Server: valida los JWT del canal movil
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${auth.jwks-uri}

# 2) Cliente OAuth2: este BFF pide su propio token (client_credentials) para llamar a ms-core-banco
spring.security.oauth2.client.provider.authserver.token-uri=${auth.token-uri}
spring.security.oauth2.client.registration.core.provider=authserver
spring.security.oauth2.client.registration.core.client-id=bff-movil-service
spring.security.oauth2.client.registration.core.client-secret=${BFF_MOVIL_SERVICE_SECRET:movilsvc123}
spring.security.oauth2.client.registration.core.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.core.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.core.scope=core.read
