spring.application.name=banco
server.port=8090

spring.datasource.url=jdbc:h2:mem:banco_xyz_core;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# La consola H2 queda deshabilitada por defecto (con OAuth2 el core no sirve paginas web)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.cl.duoc.banco=DEBUG

# ===== Kafka (en docker-compose se sobreescribe con kafka:29092) =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ===== OAuth2.0 Resource Server: URL donde auth-server publica sus llaves publicas (JWKS) =====
auth.jwks-uri=${AUTH_JWKS_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${auth.jwks-uri}
