spring.application.name=auth-server
server.port=9000

# =====================================================================
# Servidor de autorizacion OAuth2.0 - clientes registrados (client_credentials)
# Tipo A: clientes de CANAL  -> los usan las apps/cajeros para llamar a un BFF
# Tipo B: clientes de SERVICIO -> los usan los BFF para llamar a ms-core-banco
# {noop} = secreto sin cifrar (solo demo). Los secretos reales vienen de variables de entorno.
# =====================================================================

spring.security.oauth2.authorizationserver.client.cajero.registration.client-id=cajero-client
spring.security.oauth2.authorizationserver.client.cajero.registration.client-secret={noop}${CAJERO_CLIENT_SECRET:cajero123}
spring.security.oauth2.authorizationserver.client.cajero.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.cajero.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.cajero.registration.scopes=cajero.read,cajero.write

spring.security.oauth2.authorizationserver.client.web.registration.client-id=web-client
spring.security.oauth2.authorizationserver.client.web.registration.client-secret={noop}${WEB_CLIENT_SECRET:web123}
spring.security.oauth2.authorizationserver.client.web.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.web.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.web.registration.scopes=web.read

spring.security.oauth2.authorizationserver.client.movil.registration.client-id=movil-client
spring.security.oauth2.authorizationserver.client.movil.registration.client-secret={noop}${MOVIL_CLIENT_SECRET:movil123}
spring.security.oauth2.authorizationserver.client.movil.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.movil.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.movil.registration.scopes=movil.read

spring.security.oauth2.authorizationserver.client.svc-cajeros.registration.client-id=bff-cajeros-service
spring.security.oauth2.authorizationserver.client.svc-cajeros.registration.client-secret={noop}${BFF_CAJEROS_SERVICE_SECRET:cajerossvc123}
spring.security.oauth2.authorizationserver.client.svc-cajeros.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.svc-cajeros.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.svc-cajeros.registration.scopes=core.read,core.write

spring.security.oauth2.authorizationserver.client.svc-web.registration.client-id=bff-web-service
spring.security.oauth2.authorizationserver.client.svc-web.registration.client-secret={noop}${BFF_WEB_SERVICE_SECRET:websvc123}
spring.security.oauth2.authorizationserver.client.svc-web.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.svc-web.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.svc-web.registration.scopes=core.read

spring.security.oauth2.authorizationserver.client.svc-movil.registration.client-id=bff-movil-service
spring.security.oauth2.authorizationserver.client.svc-movil.registration.client-secret={noop}${BFF_MOVIL_SERVICE_SECRET:movilsvc123}
spring.security.oauth2.authorizationserver.client.svc-movil.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.svc-movil.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.svc-movil.registration.scopes=core.read

# =====================================================================
# EFT (Semana 9): clientes para los microservicios de negocio y el batch
# =====================================================================
# Cliente de BACK-OFFICE: opera los microservicios (via api-gateway) y lanza los jobs batch
spring.security.oauth2.authorizationserver.client.admin.registration.client-id=admin-client
spring.security.oauth2.authorizationserver.client.admin.registration.client-secret={noop}${ADMIN_CLIENT_SECRET:admin123}
spring.security.oauth2.authorizationserver.client.admin.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.admin.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.admin.registration.scopes=clientes.read,clientes.write,cuentas.read,cuentas.write,pagos.read,pagos.write,batch.run

# Cliente de SERVICIO: ms-cuentas -> ms-clientes
spring.security.oauth2.authorizationserver.client.svc-ms-cuentas.registration.client-id=ms-cuentas-service
spring.security.oauth2.authorizationserver.client.svc-ms-cuentas.registration.client-secret={noop}${MS_CUENTAS_SERVICE_SECRET:cuentassvc123}
spring.security.oauth2.authorizationserver.client.svc-ms-cuentas.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.svc-ms-cuentas.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.svc-ms-cuentas.registration.scopes=clientes.read

# Cliente de SERVICIO: ms-pagos -> ms-cuentas
spring.security.oauth2.authorizationserver.client.svc-ms-pagos.registration.client-id=ms-pagos-service
spring.security.oauth2.authorizationserver.client.svc-ms-pagos.registration.client-secret={noop}${MS_PAGOS_SERVICE_SECRET:pagossvc123}
spring.security.oauth2.authorizationserver.client.svc-ms-pagos.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.svc-ms-pagos.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.svc-ms-pagos.registration.scopes=cuentas.read,cuentas.write
